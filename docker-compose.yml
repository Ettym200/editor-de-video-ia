services:
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    environment:
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - default
      - easypanel

  api:
    build: ./backend
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      - redis

  worker:
    build: ./worker
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

volumes:
  uploads:
  outputs:

networks:
  default:
  easypanel:
    external: true

version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - default
      - easypanel

  api:
    build: ./backend
    ports:
      - "8001:8000"
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      - redis

  worker:
    build: ./worker
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

volumes:
  uploads:
  outputs:

networks:
  default:
  easypanel:
    external: true

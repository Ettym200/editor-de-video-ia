version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      - redis

  worker:
    build: ./worker
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

volumes:
  uploads:
  outputs:
